<h1 class="page-title">Utilizatori ({{ users().length }})</h1>
<div class="card">

  <div class="table-toolbar">
    <div class="table-filters">
      <input type="search" class="form-input table-search" placeholder="Caut&#259; dup&#259; nume..." />
      <input type="number" class="form-input" style="max-width: 150px" placeholder="Varsta minima" />
      <select class="form-select" style="max-width: 190px">
        <option>Sorteaza: nume (A-Z)</option>
        <option>Sorteaza: nume (Z-A)</option>
        <option>Sorteaza: varsta (crescator)</option>
        <option>Sorteaza: varsta (descrescator)</option>
      </select>
      <button class="btn btn-outline btn-sm">Reincarca</button>
    </div>
    <span class="endpoint-tag">GET /api/users/search</span>
  </div>

  <table>
    <thead>
    <tr>
      <th>Utilizator</th>
      <th>Varsta</th>
      <th>Identificator</th>
      <th class="text-right">Actiuni</th>
    </tr>
    </thead>
    <tbody>

    @for (user of users(); track user.id){
    <tr>
      <td>
        <div class="user-cell">
          <div class="user-cell-avatar">BA</div>
          <div>
            <div class="user-cell-name">{{user.lastName}}</div>
            <div class="user-cell-email">{{user.email}}</div>
          </div>
        </div>
      </td>
      @if (user.age<18){
      <td><span class="badge badge-warning">{{user.age}}</span></td>
      } @else {
        <td><span class="badge badge-neutral">{{user.age}}</span></td>
      }
      <td class="text-mono text-truncate">{{user.id}}</td>
      <td class="text-right">
        <div class="table-actions">
          <a href="user-detail.html" class="btn btn-outline btn-sm">Detalii</a>
          <a href="user-form.html" class="btn btn-outline btn-sm">Editeaza</a>
          <button class="btn btn-danger btn-sm">Sterge</button>
        </div>
      </td>
      <button class=" " (click)="remove(user.id)">Sterge</button>
    </tr>
    }
    </tbody>
  </table>


  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Date utilizator</h2>
      <span class="endpoint-tag">POST /api/users</span>
    </div>
    <div class="card-body">



      <div class="form-grid">

        <div class="form-group">
          <label class="form-label">Prenume</label>
          <input #first [value]="firstname()" (input)="firstname.set(first.value)"/>
        </div>

        <div class="form-group">
          <label class="form-label">Nume</label>
          <input type="text" class="form-input is-invalid" value="" />
<!--          <span class="form-error">Last name is required</span>-->
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input is-invalid" value="cristian.tudor" />
<!--          <span class="form-error">Email must be a valid address</span>-->
        </div>

        <div class="form-group">
          <label class="form-label">Parola</label>
          <input type="password" class="form-input is-invalid" value="1234" />
<!--          <span class="form-error">Password must be at least 8 characters</span>-->
<!--          <span class="form-hint">Minim 8 caractere.</span>-->
        </div>

        <div class="form-group">
          <label class="form-label">Varsta</label>
          <input type="number" class="form-input is-invalid" value="0" />
<!--          <span class="form-error">Age must be greater than zero</span>-->
<!--          <span class="form-hint">Intre 1 si 120.</span>-->
        </div>

      </div>

      <div class="form-actions">
        <button href="index.html" class="btn btn-outline">Renunta</button>
        <button type="button"  class=" btn btn-primary" (click)=" add()"  >Salveaza</button>
      </div>

    </div>
  </div>

</div>
