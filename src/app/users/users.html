<h1>Utilizatori</h1>

<div>
  <input #first [value]="firstname()" (input)="firstname.set(first.value)" placeholder="Prenume">
  <input #last [value]="lastname()" (input)="lastname.set(last.value)" placeholder="Nume">
  <input #mail [value]="email()" (input)="email.set(mail.value)" placeholder="Email">
  <input #years type="number" [value]="age()" (input)="age.set(years.valueAsNumber)" placeholder="Vârstă">
  <button [disabled]="!canSave()" (click)="save()">Salvează</button>
</div>

<br>

@if (users().length > 0) {
  <table border="1">
    @for (user of users(); track user.id) {
      <tr>
        <td>{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.age }} ani</td>
        <td>
          <button (click)="edit(user)">Editează</button>
          <button (click)="remove(user.id)">Șterge</button>
        </td>
      </tr>
    }
  </table>
} @else {
  <p>Niciun utilizator</p>
}
